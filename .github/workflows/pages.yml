# 画面のファイルだけを GitHub Pages に置き、Macが無くても各端末が最新を取れるようにする。
# main に画面のファイルが入るたびに自動で公開し直す(手動でも実行できる)。
# Pages がまだ無効なら、同じ処理の中で有効にする(enablement)。
# 置くのは画面(index.html・css・js・fonts・images・manifest・sw.js)だけ。
# server/ ・ server/data/ ・ server/certs/ ・スクリーンショット等は、置かない。
name: 画面を公開する
on:
  push:
    branches: [main]
    paths: ['index.html', 'manifest.json', 'sw.js', 'css/**', 'js/**', 'fonts/**', 'images/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 画面のファイルだけを集める
        run: |
          mkdir _site
          cp index.html manifest.json sw.js _site/
          cp -r css js fonts images _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
